services:
  jupyter:
    image: quay.io/jupyter/all-spark-notebook:spark-3.5.1
    container_name: jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
    env_file:
      - .secrets.env
    environment:
      - JUPYTER_TOKEN=ind320
    depends_on:
      mongo:
        condition: service_started
    networks: [elhubnet]


  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks: [elhubnet]

  mongo-express:
    image: mongo-express:1.0.2
    container_name: mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_BASICAUTH=false
    depends_on:
      - mongo
    networks: [elhubnet]

networks:
  elhubnet:

volumes:
  cassandra-data:
  mongo-data:
